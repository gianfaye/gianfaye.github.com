name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site-v2/.nvmrc
          cache: npm
          cache-dependency-path: site-v2/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: site-v2

      - name: Type check
        run: npx astro check
        working-directory: site-v2

      - name: Build
        run: npm run build
        working-directory: site-v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-v2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
