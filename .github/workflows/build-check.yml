name: Build check (site-v2)

on:
  pull_request:
    paths:
      - 'site-v2/**'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site-v2/.nvmrc
          cache: npm
          cache-dependency-path: site-v2/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: site-v2

      - name: Type check
        run: npx astro check
        working-directory: site-v2

      - name: Build
        run: npm run build
        working-directory: site-v2
